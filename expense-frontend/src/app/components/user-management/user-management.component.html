<div class="user-management">
  <div class="header">
    <h2>👥 User Management</h2>
    <button class="btn-primary" (click)="showCreateForm = !showCreateForm">
      {{ showCreateForm ? 'Cancel' : '+ Add User' }}
    </button>
  </div>

  <!-- Create User Form -->
  <div class="create-form" *ngIf="showCreateForm">
    <h3>Create New User</h3>
    <form (ngSubmit)="createUser()" #userForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username"
            [(ngModel)]="newUser.username" 
            name="username"
            required
            placeholder="Enter username">
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email"
            [(ngModel)]="newUser.email" 
            name="email"
            required
            placeholder="Enter email">
        </div>
      </div>
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <input 
          type="text" 
          id="name"
          [(ngModel)]="newUser.name" 
          name="name"
          required
          placeholder="Enter full name">
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="!userForm.form.valid">
          Create User
        </button>
        <button type="button" class="btn-secondary" (click)="resetForm()">
          Cancel
        </button>
      </div>
    </form>
  </div>

  <!-- Users List -->
  <div class="users-section">
    <div *ngIf="loading" class="loading">
      <p>Loading users...</p>
    </div>

    <div *ngIf="!loading && users.length === 0" class="no-users">
      <p>No users found. Create the first user to get started!</p>
    </div>

    <div class="users-grid" *ngIf="!loading && users.length > 0">
      <div class="user-card" *ngFor="let user of users">
        <div class="user-avatar">
          {{user.name.charAt(0).toUpperCase()}}
        </div>
        
        <div class="user-info">
          <h4>{{user.name}}</h4>
          <p class="username">&#64;{{user.username}}</p>
          <p class="email">{{user.email}}</p>
        </div>
        
        <div class="user-actions">
          <button class="btn-select" (click)="selectUser(user)">
            Select
          </button>
          <button class="btn-delete" (click)="deleteUser(user)">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
